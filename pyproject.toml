[project]
name = "issue-to-repro"
version = "0.1.0"
description = "Agent that reproduces GitHub issues in a sandbox and proposes verified fixes"
requires-python = ">=3.10"
license = { text = "MIT" }
# fastapi and contree-sdk are needed to serve the app on Nebius Sandboxes; they are listed here
# (not only as extras) because hosts such as Vercel install the main dependencies only.
dependencies = ["jsonschema>=4", "fastapi>=0.110", "contree-sdk==0.3.6"]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]
web = ["fastapi>=0.110", "uvicorn>=0.27"]
nebius = ["contree-sdk==0.3.6"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
itr = ["agent/prompts/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
